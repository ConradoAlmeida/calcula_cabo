# ============================================================================
# Configuração e calibração da Calculadora de Bitola de Cabo DC
# ----------------------------------------------------------------------------
# Este arquivo concentra todas as constantes físicas, tabelas de conversão e
# valores padrão de entrada usados pelos cálculos. Edite os números aqui para
# recalibrar/verificar os resultados sem mexer no código.
#
# Todos os campos possuem um valor padrão embutido no código; se este arquivo
# (ou uma chave) estiver ausente, o valor padrão embutido é usado.
# ============================================================================

[fisica]
# Resistividade do cobre a 20 °C (Ohm·mm²/m)
resistividade_cobre = 0.0175
# Densidade do cobre (kg/m³)
densidade_cobre = 8900
# Calor específico do cobre (J/(kg·°C))
calor_especifico_cobre = 385
# Coeficiente de transferência térmica por convecção, ar parado (W/(m²·°C))
# Valores típicos: 5 a 25; 10 é um valor médio.
coef_conveccao = 10
# Espessura de isolação somada ao diâmetro do condutor quando o diâmetro
# externo não é informado (mm)
espessura_isolacao = 2.0

[padroes]
# Valores fixos de entrada, usados quando o campo é deixado em branco.
distancia = 10
corrente = 5
tensao = 12
queda_percentual = 3
temp_max = 200
temp_amb = 25

[bitolas_comerciais]
# Bitolas comerciais disponíveis, em mm² (lista separada por vírgula).
valores = 0.5, 0.75, 1.0, 1.5, 2.5, 4.0, 6.0, 10.0, 16.0, 25.0, 35.0, 50.0, 70.0, 95.0, 120.0, 150.0, 185.0, 240.0, 300.0, 400.0, 500.0, 630.0

[conversao_awg]
# Conversão de bitola (mm²) -> AWG / MCM. Formato: <mm2> = <awg>
0.5 = 20
0.75 = 19
1.0 = 18
1.5 = 16
2.5 = 14
4.0 = 12
6.0 = 10
10.0 = 8
16.0 = 6
25.0 = 4
35.0 = 2
50.0 = 1
70.0 = 1/0
95.0 = 2/0
120.0 = 3/0
150.0 = 4/0
185.0 = 250 MCM
240.0 = 300 MCM
300.0 = 350 MCM
400.0 = 400 MCM
500.0 = 500 MCM
630.0 = 600 MCM

[capacidade_corrente]
# Capacidade de corrente aproximada (~30 °C) por bitola (mm²) -> Amperes.
# Usada apenas na tabela de referência.
1.5 = 16
2.5 = 20
4.0 = 25
6.0 = 32
10.0 = 44
16.0 = 60
25.0 = 80
35.0 = 100
50.0 = 125
70.0 = 160
95.0 = 195
120.0 = 225
150.0 = 260
185.0 = 300
240.0 = 355

[instalacao]
# Método de instalação -> coeficiente de convecção efetivo (W/(m²·°C)).
# Quanto pior a dissipação de calor, menor o coeficiente (cabo mais quente).
# Formato: <id> = <coeficiente>
ar_livre = 10
eletroduto_aparente = 6
eletroduto_embutido = 4
enterrado = 3
# Método usado por padrão quando nenhum é informado (não é um método em si).
padrao = ar_livre

[instalacao_rotulos]
# Rótulos exibidos na interface para cada método (id = texto).
ar_livre = Ao ar livre (exposto)
eletroduto_aparente = Em eletroduto aparente
eletroduto_embutido = Em eletroduto embutido na parede
enterrado = Enterrado / subterrâneo

[agrupamento]
# Fator aplicado ao coeficiente de convecção conforme o número de condutores
# agrupados lado a lado (mais condutores juntos = pior dissipação).
# Valores aproximados; para n acima do último, usa-se o último fator.
1 = 1.00
2 = 0.85
3 = 0.79
4 = 0.75
5 = 0.73
6 = 0.72
7 = 0.71
8 = 0.70
