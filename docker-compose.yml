services:
  calcula-cabo:
    build: .
    container_name: moya-calcula-cabo
    ports:
      - "8000:8000"
    volumes:
      - ./config.ini:/app/config.ini:ro
    env_file:
      - .env
    environment:
      CREDENTIALS_URL: ${CREDENTIALS_URL:-http://moya-credenciais:8080}
    networks:
      - default
      - moya
    restart: unless-stopped

networks:
  moya:
    external: true
    name: moya
