services:
  calcula-cabo:
    build: .
    container_name: moya-calcula-cabo
    ports:
      - "8000:8000"
    volumes:
      - ./config.ini:/app/config.ini:ro
    environment:
      CREDENTIALS_URL: ${CREDENTIALS_URL:-http://moya-credenciais:8080}
      CREDENTIALS_API_TOKEN: ${CREDENTIALS_API_TOKEN:-}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
    networks:
      - default
      - moya
    restart: unless-stopped

networks:
  moya:
    external: true
    name: moya
